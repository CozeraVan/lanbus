name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
        exclude:
          - os: macos-latest
            python: "3.9"
          - os: windows-latest
            python: "3.9"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest tests -v

  go-scan:
    name: Go scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Test
        working-directory: go
        run: go test ./...
      - name: Build scanner
        working-directory: go
        run: go build -trimpath -ldflags="-s -w" -o ../bin/lanbus-scan-linux-amd64 ./cmd/lanbus-scan
      - name: Build worker
        working-directory: go
        run: go build -trimpath -ldflags="-s -w" -o ../bin/lanbus-worker-linux-amd64 ./cmd/lanbus-worker
      - name: Build Go hub
        working-directory: go
        run: go build -trimpath -ldflags="-s -w" -o ../bin/lanbusd-linux-amd64 ./cmd/lanbusd

  build:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install and smoke test
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/lanbus --version
          /tmp/venv/bin/lanbus doctor
          /tmp/venv/bin/lanbus-hub --help | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*