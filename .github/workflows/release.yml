name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Release test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python package
        run: python -m pip install -e ".[dev]"
      - name: Test Python
        run: python -m pytest tests -q
      - name: Test Go
        working-directory: go
        run: go test ./...

  cli:
    name: cli ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Derive and verify version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          source_version="$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' src/lanbus/__init__.py)"
          if [ -z "$source_version" ] || [ "$version" != "$source_version" ]; then
            echo "tag version '$version' does not match __version__ '$source_version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cross-build CLI/hub/worker/scanner
        working-directory: go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
          mkdir -p ../dist/cli
          for cmd in lanbus lanbusd lanbus-worker lanbus-scan; do
            go build -trimpath \
              -ldflags="-s -w -X github.com/CozeraVan/lanbus/go/internal/version.Version=${{ steps.ver.outputs.version }}" \
              -o "../dist/cli/${cmd}-${GOOS}-${GOARCH}${ext}" "./cmd/${cmd}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/cli/*

  gui:
    name: Windows portable and installer
    needs: cli
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Derive and verify version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          source_version="$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' src/lanbus/__init__.py)"
          if [ -z "$source_version" ] || [ "$version" != "$source_version" ]; then
            echo "tag version '$version' does not match __version__ '$source_version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: cli-windows-amd64
          path: bin
      - name: Arrange native binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($command in @("lanbus", "lanbusd", "lanbus-worker", "lanbus-scan")) {
            Move-Item -Force "bin/$command-windows-amd64.exe" "bin/$command.exe"
          }
      - name: Build Wails GUI
        working-directory: go
        run: go build -tags production -ldflags="-H=windowsgui -s -w" -o ../bin/lanbus-gui.exe ./cmd/lanbus-gui
      - name: Build portable ZIP
        run: python scripts/package_windows.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "packaging\windows\lanbus.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/lanbus-*-windows-amd64.zip
            dist/lanbus-*-setup.exe

  package-macos:
    name: macOS PKG
    needs: cli
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive and verify version
        id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          source_version="$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' src/lanbus/__init__.py)"
          if [ -z "$source_version" ] || [ "$version" != "$source_version" ]; then
            echo "tag version '$version' does not match __version__ '$source_version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: cli-darwin-arm64
          path: bin
      - name: Build PKG
        run: bash packaging/macos/build-pkg.sh "${{ steps.ver.outputs.version }}" arm64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: dist/lanbus-*-macos-arm64.pkg

  package-linux:
    name: Linux DEB
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive and verify version
        id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          source_version="$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' src/lanbus/__init__.py)"
          if [ -z "$source_version" ] || [ "$version" != "$source_version" ]; then
            echo "tag version '$version' does not match __version__ '$source_version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: cli-linux-amd64
          path: bin
      - name: Build DEB
        run: bash packaging/linux/build-deb.sh "${{ steps.ver.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/lanbus_*_amd64.deb

  wheel:
    name: Python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*

  release:
    name: Publish release
    needs: [test, cli, gui, wheel, package-macos, package-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect artifacts, verify installers and create checksums
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          test -f "release/lanbus-${version}-setup.exe"
          test -f "release/lanbus-${version}-windows-amd64.zip"
          test -f "release/lanbus-${version}-macos-arm64.pkg"
          test -f "release/lanbus_${version}_amd64.deb"
          test -f "release/lanbus-${version}-py3-none-any.whl"
          cd release
          sha256sum * > SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
