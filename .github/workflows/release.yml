name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cli:
    name: cli ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Derive version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Cross-build CLI/hub/worker/scanner
        working-directory: go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
          mkdir -p ../dist/cli
          for cmd in lanbus lanbusd lanbus-worker lanbus-scan; do
            go build -trimpath \
              -ldflags="-s -w -X github.com/CozeraVan/lanbus/go/internal/version.Version=${{ steps.ver.outputs.version }}" \
              -o "../dist/cli/${cmd}-${GOOS}-${GOARCH}${ext}" "./cmd/${cmd}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/cli/*

  gui:
    name: Windows GUI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Build Wails GUI
        working-directory: go
        run: go build -tags production -ldflags="-H=windowsgui -s -w" -o ../dist/lanbus-gui-windows-amd64.exe ./cmd/lanbus-gui
      - uses: actions/upload-artifact@v4
        with:
          name: gui
          path: dist/lanbus-gui-windows-amd64.exe

  wheel:
    name: Python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*

  release:
    name: Publish release
    needs: [cli, gui, wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect artifacts + checksums
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true