name: Feature request
description: Suggest a capability or compatibility improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is blocked?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: API/UI/protocol shape, if known.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [hub, worker, discovery, chat, approval/security, GUI, packaging, docs]
